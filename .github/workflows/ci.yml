name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sharing-presentation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sharing-presentation/package-lock.json

      - name: Install dependencies
        working-directory: sharing-presentation
        run: npm ci

      - name: Type-check
        working-directory: sharing-presentation
        run: npx tsc --noEmit

      - name: Build
        working-directory: sharing-presentation
        run: npm run build
        env:
          # Placeholders so Next.js build-time checks can pass.
          # Real values come from Vercel project env vars at deploy time.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
          NEXT_PUBLIC_ADMIN_PASSWORD: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
